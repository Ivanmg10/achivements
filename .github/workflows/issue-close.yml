# GitHub closes "Closes #123" issues only for PRs into the default branch (main),
# and work is merged into develop. This closes them when such a PR is merged.
name: Close issues

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions: {}

jobs:
  close-issues:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the issues the PR resolves
        env:
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(printf '%s\n' "$BODY" | tr -d '\r' | sed 's/<!--.*-->//g' \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
            # A PR shares the numbering: never close one cited by mistake.
            if [ "$(gh api "repos/$GH_REPO/issues/$n" --jq '.pull_request != null')" = true ]; then
              echo "#$n is a pull request; left alone."
              continue
            fi
            # Already closed is not an error for gh.
            gh issue close "$n" --reason completed --comment "Resolved by #$PR (merged into develop)."
          done
